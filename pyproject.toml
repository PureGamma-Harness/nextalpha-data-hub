[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nextalpha-market-watcher"
version = "0.1.0"
description = "Binance U perpetual market watcher with alerting and 1h close push."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.1",
  "PyYAML>=6.0.1",
  "redis>=5.0.4",
  "websockets>=12.0",
  "httpx[socks]>=0.27.0",
  "PySocks>=1.7.1",
  "tenacity>=8.2.3",
  "orjson>=3.10.3",
  "prometheus-client>=0.20.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "aiohttp>=3.9.0",
]

[project.scripts]
nextalpha-watcher = "nextalpha_market_watcher.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

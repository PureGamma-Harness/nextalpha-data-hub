# 告警与 1h 推送拆成两个容器，可单独 build / restart。
# 共用同一镜像与 config.docker.yaml；通过 --mode 区分职责。

services:
  market-watcher-alerts:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nextalpha-market-watcher-alerts
    restart: unless-stopped
    environment:
      # Lark webhook secrets; set them in a local .env file (git-ignored) or the shell.
      WEBHOOK__URL: ${WEBHOOK__URL:-}
      WEBHOOK__ALERTS_URL: ${WEBHOOK__ALERTS_URL:-}
    command:
      - nextalpha-watcher
      - serve
      - --config
      - /app/config.yaml
      - --mode
      - alerts
      - --host
      - 0.0.0.0
      - --port
      - "8765"
    ports:
      - "8765:8765"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    volumes:
      - ./config.docker.yaml:/app/config.yaml:ro

  market-watcher-klines:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nextalpha-market-watcher-klines
    restart: unless-stopped
    environment:
      # Lark webhook secrets; set them in a local .env file (git-ignored) or the shell.
      WEBHOOK__URL: ${WEBHOOK__URL:-}
      WEBHOOK__ALERTS_URL: ${WEBHOOK__ALERTS_URL:-}
    command:
      - nextalpha-watcher
      - serve
      - --config
      - /app/config.yaml
      - --mode
      - klines
      - --host
      - 0.0.0.0
      - --port
      - "8766"
    ports:
      - "8766:8766"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    volumes:
      - ./config.docker.yaml:/app/config.yaml:ro
      - ./logs:/app/logs

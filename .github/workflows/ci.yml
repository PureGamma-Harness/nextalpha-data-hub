name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e ".[dev]"
      - name: Ruff (pyflakes F rules)
        run: ruff check --select F .
      - name: Compile
        run: python -m compileall -q src tests
      - name: Validate repo configs
        run: |
          python - <<'PY'
          from nextalpha_market_watcher.config import load_config
          for path in ("config.example.yaml", "config.prod.yaml", "config.docker.yaml"):
              load_config(path)
              print("ok", path)
          PY
      - name: Pytest
        run: python -m pytest -q

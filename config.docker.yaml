# Docker Compose 默认配置。
# 职责由 compose 的 command --mode 指定（alerts / klines），无需在此写 service_mode。
app_name: nextalpha-market-watcher
service_region: ap-northeast-1
log_level: INFO

binance:
  ws_base: wss://fstream.binance.com/market/stream
  rest_base: https://fapi.binance.com
  symbols_refresh_seconds: 1800
  ws_watchdog_enabled: true
  # WebSocket 显式走代理（容器内通过宿主机 10808 转发）。
  # 优先用 socks5，通常比 http CONNECT 对 WS 更稳定。
  ws_proxy_url: socks5://host.docker.internal:10808
  # REST 对账/修补也可显式走同一个宿主机代理。
  rest_proxy_url: socks5://host.docker.internal:10808
  # 联调期：给第一次收到“已收盘kline”留足窗口
  # 避免 watchdog 在首次 close 前就触发重连。
  ws_watchdog_no_data_periods: 2
  ws_watchdog_check_seconds: 15
  use_test_symbols: false
  test_symbols: []

backfill:
  enabled: true
  rest_timeout_seconds: 15.0
  rest_concurrency: 8
  rest_request_delay_seconds: 0.02
  bars_1m: 32
  bars_1h: 3
  klines_limit_cap: 1500

redis:
  url: redis://host.docker.internal:6379/5
  key_prefix: "nw:"
  stream_1h_closed: stream:kline:1h:closed
  stream_downstream_ack: stream:kline:1h:ack
  stream_latency_events: stream:latency:events
  stream_maxlen: 200000
  published_1h_ttl_seconds: 32400
  one_m_ring_max_bars: 480
  one_m_ring_ttl_seconds: 129600
  pending_latency_max: 100000

alerts:
  threshold_1m_pct: 10.0
  threshold_5m_pct: 15.0
  threshold_1h_pct: 25.0
  threshold_4h_pct: 40.0
  cooldown_seconds: 900

webhook:
  enabled: true
  url: "https://open.larksuite.com/open-apis/bot/v2/hook/7187f951-2496-4c16-a026-4cb67bf9ef77"
  proxy_url: socks5://host.docker.internal:10808
  alerts_url: "https://open.larksuite.com/open-apis/bot/v2/hook/ade1cabd-dcd8-49c0-a98e-cbcc5a1e11b0"

latency:
  e2e_warn_ms: 1500

metrics:
  enabled: true
  host: 0.0.0.0
  port: 9090

websocket:
  host: 0.0.0.0
  alerts_port: 8765
  klines_port: 8766
  # 当前联调阶段使用 5m；生产切换为 1h
  klines_interval: 5m
  # K线批次使用 Binance 原生 @kline_<interval> 闭合帧；成交额直接取 k.q，与 REST row[7] 同口径。
  klines_source: kline
  aggtrade_emit_grace_ms: 800
  # 单个 symbol 的事件延迟不再触发 hold/reconnect；整条分片静默由 watchdog 处理
  aggtrade_ws_max_event_lag_seconds: 0.0
  # 已推送周期的 late trade 只跳过，不再打印逐条警告；字段保留兼容旧配置
  aggtrade_late_trade_log_limit_per_close: 0
  # 仅用于异步 REST K线对账，不会开启第二条 kline WebSocket；观测稳定几天后可改为 false
  aggtrade_compare_with_kline: true
  # 收盘后 10s 再启动 REST 对账；客户端推送不等待这个验证
  aggtrade_rest_compare_delay_seconds: 10.0
  aggtrade_rest_compare_concurrency: 8
  # Lark 汇总最多等待 REST 对账结果 120s，超时则先发汇总
  aggtrade_rest_compare_lark_timeout_seconds: 120.0
  # 多链路诊断：抽样50个symbol，在 close+800/1800/3000/5000ms 做本地快照与REST快照对比
  aggtrade_rest_diagnostic_enabled: true
  aggtrade_rest_diagnostic_sample_size: 50
  aggtrade_rest_diagnostic_offsets_ms: [800, 1800, 3000, 5000]
  # aggTrade 实时流静默超过 30s 即重建分片，避免等到整个 K线周期后才发现断流
  aggtrade_ws_watchdog_stale_seconds: 30
  aggtrade_price_tolerance: "0"
  aggtrade_volume_tolerance: "0.00000001"
  aggtrade_quote_tolerance: "0.000001"
  # 分片模式：每条WS连接承载约80个symbol
  klines_ws_batch_size: 80
  # false：同一收盘时刻在服务端聚齐后整批一次下发（与生产一致）
  klines_passthrough_mode: false
  klines_replay_count: 3
  # 全量模式：优先等全量；达到等待上限后可按容忍缺失阈值放行
  klines_full_batch_only: true
  # 等待上限后，缺失<=10 视作可接受并放行
  klines_max_missing_symbols: 10
  # 最长等待 1.2s，超时且缺失<=10 则放行；否则走 REST 修补
  klines_full_batch_max_wait_ms: 1200
  # 收盘后最短等待窗口（给慢一点的symbol留一点时间），超时即推
  klines_flush_grace_ms: 5000
  # 达标推送比例（0~1）；1.0 表示必须全量才推送
  klines_min_publish_ratio: 1.0
  # REST 用于修复缺失：等待 3s 后开始补齐
  klines_rest_repair_delay_ms: 3000
  # 打印每个批次的完整缺失symbol列表（默认开启，便于对账）
  klines_log_full_missing_symbols: true
  # WS 长时间静默时是否启用 REST 兜底修复（实盘追求低延迟可改为 false）
  klines_ws_silence_fallback_rest: false
